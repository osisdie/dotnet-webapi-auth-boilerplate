name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  COREFX_API_NAME: auth-api-ci

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '10.0.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore auth-api-all-projects.sln

      - name: Build
        run: dotnet build auth-api-all-projects.sln --no-restore -c Release

      - name: Test
        run: dotnet test auth-api-all-projects.sln --no-build -c Release --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Development
